name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # Xcode 27 (iOS 27 SDK) has its own runner image label.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      # App Store Connect requires the iOS 27 SDK (Xcode 27) from April 2027.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Timaro.xcodeproj \
            -scheme Timaro \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project Timaro.xcodeproj \
            -scheme Timaro \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
