name: TestFlight

# Builds a signed release and uploads it to App Store Connect / TestFlight.
# Signing is fully cloud-managed via an App Store Connect API key, so no Mac,
# certificate or provisioning profile is needed locally. See docs/TESTFLIGHT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::TestFlight secrets are not set yet - skipping upload. See docs/TESTFLIGHT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      # App Store Connect only accepts builds made with the iOS 26 SDK or later.
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          xcode-version: latest-stable

      - name: Install API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Archive unsigned; the export step below signs for distribution with a
          # cloud-managed certificate, so no device or development certificate is needed.
          xcodebuild archive \
            -project Timaro.xcodeproj \
            -scheme Timaro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Timaro.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed entitlements
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # The unsigned archive carries no entitlements, but the export keeps the ones it
          # finds in the binaries. Ad-hoc sign with the App Group so app and widget can share data.
          APP="$RUNNER_TEMP/Timaro.xcarchive/Products/Applications/Timaro.app"
          codesign --force --sign - --entitlements TimaroWidget/TimaroWidget.entitlements "$APP/PlugIns/TimaroWidget.appex"
          codesign --force --sign - --entitlements Timaro/Timaro.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/TimaroWidget.appex"

      - name: Sign and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Timaro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
