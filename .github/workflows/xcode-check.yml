name: Xcode check

# One-off check: which Xcode versions the GitHub Mac has, and whether Timaro builds and
# passes its tests with Xcode 27 (iOS 27 SDK), which App Store Connect requires from April 2027.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/xcode-check.yml

jobs:
  check:
    # Xcode 27 runs on its own image label (GA since October 2026).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: List Xcode versions and simulator runtimes
        run: |
          for app in /Applications/Xcode*.app; do
            echo "== $app"
            DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version || true
          done
          echo "== Selected by default"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick Xcode 27 or later
        id: pick
        run: |
          best=""
          for app in /Applications/Xcode*.app; do
            version=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1 {print $2}')
            major=${version%%.*}
            if [ -n "$major" ] && [ "$major" -ge 27 ] 2>/dev/null; then best="$app"; fi
          done
          if [ -z "$best" ]; then
            echo "::notice::No Xcode 27 or later on this runner."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Using $best"
            sudo xcode-select -s "$best/Contents/Developer"
            xcodebuild -version
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test with Xcode 27
        if: steps.pick.outputs.found == 'true'
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Timaro.xcodeproj -scheme Timaro \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project Timaro.xcodeproj -scheme Timaro -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO
