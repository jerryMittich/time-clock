name: Timaro
options:
  bundleIdPrefix: com.timaro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  Timaro:
    type: application
    platform: iOS
    sources:
      - path: Timaro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timaro.timeclock
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timaro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Timaro uses your location to show your workplaces on the map."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Timaro uses your location in the background to clock you in and out automatically when you arrive at or leave a workplace."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Timaro/Info.plist
      properties:
        UIBackgroundModes: [location]
        CFBundleLocalizations: [en, de, it]
    scheme:
      testTargets:
        - TimaroTests
  TimaroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimaroTests
    dependencies:
      - target: Timaro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timaro.timeclock.tests
        GENERATE_INFOPLIST_FILE: YES
