name: Vivaro
options:
  bundleIdPrefix: com.vivaro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  Vivaro:
    type: application
    platform: iOS
    sources:
      - path: Vivaro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivaro.timeclock
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vivaro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Vivaro uses your location to show your workplaces on the map."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Vivaro uses your location in the background to clock you in and out automatically when you arrive at or leave a workplace."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Vivaro/Info.plist
      properties:
        UIBackgroundModes: [location]
        CFBundleLocalizations: [en, it]
